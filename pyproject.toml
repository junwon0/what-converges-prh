[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "what-converges-prh"
version = "0.1.0"
description = "Code for What Converges in the Platonic Representation Hypothesis? Structure Over Geometry"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = [
  "representation-learning",
  "representation-similarity",
  "platonic-representation-hypothesis",
  "persistent-homology",
  "topological-data-analysis",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]
dependencies = [
  "torch>=2.1.2",
  "torchvision",
  "numpy",
  "scipy",
  "tqdm",
  "datasets",
  "transformers",
  "timm",
  "accelerate",
  "sentencepiece",
  "protobuf",
  "loguru",
  "Pillow",
  "opencv-python",
  "decord",
  "matplotlib",
]

[tool.setuptools.packages.find]
include = ["aristotelian*", "scripts*"]
